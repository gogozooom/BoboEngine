name: CI - Unit Tests

on:
  push:
    branches:
      - "*"
  pull_request:
    branches:
      - main

jobs:
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v2

      - name: Set up .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build the solution
        run: dotnet build --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test ./BoboEngine.Tests/BoboEngine.Tests.csproj --no-build --configuration Release